server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_MAX_THREADS:200}
      min-spare: ${HTTP_MIN_SPARE_THREADS:20}
    max-connections: ${HTTP_MAX_CONNECTIONS:8192}
    accept-count: ${HTTP_ACCEPT_COUNT:1000}

spring:
  application:
    name: mfd-brokerage-analysis-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mfd_brokerage_ai}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
    username: ${DB_USERNAME:mfd_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MfdHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      initialization-fail-timeout: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  email:
    public-backend-url: ${APP_EMAIL_PUBLIC_BACKEND_URL:}
    frontend-url: ${APP_EMAIL_FRONTEND_URL:http://localhost:5173}
    encryption-key-base64: ${APP_EMAIL_ENCRYPTION_KEY_BASE64:}
    gmail:
      client-id: ${GMAIL_OAUTH_CLIENT_ID:}
      client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_OAUTH_CLIENT_ID:}
      client-secret: ${MICROSOFT_OAUTH_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
